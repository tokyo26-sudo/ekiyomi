<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>えきよみ 역읽기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+JP:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&family=Shippori+Mincho:wght@700&family=Zen+Maru+Gothic:wght@700&family=Klee+One:wght@600&family=Noto+Serif+KR:wght@700&family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap">
<style>
/* Layout: one column like a platform — status bar, then a station sign as the hero of each question.
   Default is black on white; the dark theme is a setting (white on black). */
:root{
  --bg:#FFFFFF;
  --panel:#F3F4F2;
  --sign:#FFFFFF;
  --ink:#111417;
  --muted:#5E676D;
  --rule:#D5D9D6;
  --accent:#1D4F8F;
  --ok:#1E8A4C; --close:#B26F12; --ng:#C0392B;
  --okbg:#E6F4EB; --closebg:#FBF0DC; --ngbg:#F9E5E2;
  --lv0:#D5D9D6; --lv1:#9DB8DA; --lv2:#1D4F8F;
  --shadow:0 1px 0 rgba(0,0,0,.05),0 6px 18px -10px rgba(20,30,40,.3);
  --f-ja:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --f-ko:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow",sans-serif;
  --gf-ja:var(--f-ja); --gf-ko:var(--f-ko);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1113;--panel:#191E21;--sign:#151A1D;--ink:#FFFFFF;--muted:#A3ADB3;--rule:#323A3F;--accent:#8DB4EA;
  --ok:#5BC98A;--close:#E7B25A;--ng:#F07A6B;--okbg:#14301F;--closebg:#352A14;--ngbg:#3A1E1A;
  --lv0:#323A3F;--lv1:#3E5878;--lv2:#8DB4EA;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 22px -10px rgba(0,0,0,.8);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1113;--panel:#191E21;--sign:#151A1D;--ink:#FFFFFF;--muted:#A3ADB3;--rule:#323A3F;--accent:#8DB4EA;
  --ok:#5BC98A;--close:#E7B25A;--ng:#F07A6B;--okbg:#14301F;--closebg:#352A14;--ngbg:#3A1E1A;
  --lv0:#323A3F;--lv1:#3E5878;--lv2:#8DB4EA;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 22px -10px rgba(0,0,0,.8);color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ja);line-height:1.6;font-size:15px}
:lang(ko){font-family:var(--f-ko)}
.glyph:lang(ja){font-family:var(--gf-ja)}
.glyph:lang(ko){font-family:var(--gf-ko)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 48px}

/* header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--rule)}
.bar-in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:baseline;gap:8px;font-weight:900;font-size:1.15rem;letter-spacing:.02em;background:none;border:0;padding:0}
.logo small{font-family:var(--f-ko);font-weight:700;color:var(--muted);font-size:.85rem}
.bar-btns{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.tbtn{border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:700}
.tbtn:hover{border-color:var(--accent)}

/* start */
.hero{padding-block:28px 8px;display:grid;gap:6px}
.hero h1{margin:0;font-size:clamp(1.45rem,5vw,2.1rem);font-weight:900;line-height:1.3;text-wrap:balance}
.hero .sub1{margin:0;font-weight:700;color:var(--accent);font-size:clamp(.95rem,3.2vw,1.2rem);line-height:1.4}
.hero p{margin:0;color:var(--muted)}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:18px}
.pick button{text-align:left;border:1px solid var(--rule);background:var(--panel);border-radius:10px;padding:16px;display:grid;gap:12px}
.pick button:hover:not(:disabled){border-color:var(--accent)}
.pick button:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(1)}
.pick .pnote{font-size:.8rem;font-weight:700;color:var(--ink)}
.pick .who{font-weight:900;font-size:1.15rem}
.pick .what{color:var(--muted);font-size:.9rem}
.mini{display:flex;align-items:center;gap:10px;font-weight:900}
.mini .ms{background:var(--sign);border:1px solid var(--rule);border-top:5px solid var(--c);border-radius:4px;padding:4px 12px;font-size:1.4rem}
.mini .arrow{color:var(--muted);font-weight:400}
.mini .ans{font-size:1.1rem;color:var(--accent)}
.how{margin-top:26px;display:grid;gap:10px;color:var(--muted);font-size:.9rem;max-width:62ch}
.how b{color:var(--ink)}

/* line select */
.stage{margin-top:24px}
.stage h2{margin:0 0 10px;font-size:.8rem;letter-spacing:.12em;color:var(--muted);display:flex;gap:10px;align-items:center}
.stage h2::after{content:"";flex:1;border-top:1px solid var(--rule)}
.lines{display:grid;gap:10px}
.lcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;text-align:left;border:1px solid var(--rule);background:var(--panel);border-radius:10px;padding:12px 14px}
.lcard:hover:not(:disabled){border-color:var(--c)}
.lcard:disabled{opacity:.5;cursor:not-allowed}
.sym{width:44px;height:44px;border-radius:50%;border:5px solid var(--c);background:var(--sign);display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:1.35rem;line-height:1}
.lname{font-weight:900;font-size:1.05rem}
.lsub{font-size:.8rem;color:var(--muted)}
.meter{display:block;height:5px;border-radius:3px;background:var(--rule);margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--c)}
.sym.two{font-size:1.05rem;letter-spacing:-.02em}
.lstat{text-align:right;font-family:var(--f-num);font-size:1.1rem;font-variant-numeric:tabular-nums;min-width:5em}
.lstat small{display:block;font-family:var(--f-ja);font-size:.72rem;color:var(--muted)}
.lock{font-size:.85rem;color:var(--muted);margin:0 0 8px}
.done-badge{color:var(--ok);font-weight:900}

/* play */
.ptop{display:flex;align-items:center;gap:10px;padding-block:12px 8px;flex-wrap:wrap}
.back{border:0;background:none;color:var(--accent);font-weight:700;padding:0}
.pline{font-weight:900;display:flex;align-items:center;gap:8px}
.pline .sym{width:28px;height:28px;border-width:3px;font-size:.9rem}
.quit{margin-left:auto;border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:3px 12px;font-size:.82rem;font-weight:700}
.hud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:10px}
.hud div{background:var(--panel);border-radius:8px;padding:4px 8px;display:grid}
.hud small{font-size:.68rem;color:var(--muted)}
.hud b{font-family:var(--f-num);font-size:1.45rem;line-height:1.1;font-variant-numeric:tabular-nums}
.hud .low b{color:var(--ng)}
.strip{display:grid;gap:6px;margin-bottom:12px}
.strip-sec{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.strip-sec .lbl{font-size:.7rem;color:var(--muted);margin-right:4px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--c);background:var(--sign)}
.dot.lit{background:var(--c)}
.dot.now{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
@media (prefers-reduced-motion:no-preference){.dot.now{animation:pop .6s ease}@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.5)}100%{transform:none}}}

.sign{background:var(--sign);border:1px solid var(--rule);border-radius:6px;box-shadow:var(--shadow);overflow:hidden}
.sign-band{height:12px;background:var(--c)}
.sign-body{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:18px 18px 14px}
.code{width:68px;height:68px;border:8px solid var(--c);border-radius:50%;flex:none;display:grid;place-items:center;align-content:center;text-align:center;font-family:var(--f-num);font-weight:700;line-height:.95;background:var(--sign)}
.code.kr{border-radius:50%}
.code .cl{font-size:1rem}
.code .cn{font-size:1.45rem}
.code.kr .cn{font-size:1.15rem}
.code .hide{color:var(--muted)}
.q{font-weight:900;font-size:clamp(2.2rem,10vw,4.4rem);line-height:1.2;text-align:center;overflow-wrap:anywhere;word-break:keep-all;letter-spacing:.02em}
.q.long{font-size:clamp(1.6rem,7vw,3rem)}
.q.xlong{font-size:clamp(1.3rem,5.4vw,2.4rem)}
.sign-foot{border-top:1px solid var(--rule);padding:10px 18px;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;align-items:baseline;min-height:46px}
.sign-foot .k{font-weight:900;font-size:1.25rem}
.sign-foot .r{font-family:var(--f-num);font-weight:600;font-size:1.15rem;letter-spacing:.03em}
.sign-foot .s{color:var(--muted)}
.sign-foot .hidden{color:var(--muted);letter-spacing:.3em}

.act{margin-top:12px;display:grid;gap:8px}
.ansrow{display:flex;gap:8px}
.ansrow input{flex:1;min-width:0;font:inherit;font-size:1.25rem;padding:10px 14px;border:2px solid var(--rule);border-radius:8px;background:var(--sign);color:var(--ink)}
.ansrow input:focus{border-color:var(--accent);outline:none}
.go{border:0;border-radius:8px;background:var(--accent);color:var(--sign);font-weight:900;padding:0 20px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choices button{border:2px solid var(--rule);background:var(--sign);border-radius:8px;padding:12px 8px;font-size:1.25rem;font-weight:700;overflow-wrap:anywhere}
.choices button:hover:not(:disabled){border-color:var(--accent)}
.choices button.gone{opacity:.25;text-decoration:line-through}
.choices button.right{border-color:var(--ok);background:var(--okbg)}
.choices button.wrong{border-color:var(--ng);background:var(--ngbg)}
.prompt{text-align:center;color:var(--muted);margin:0;font-size:.88rem}
.subrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.sbtn{border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:6px 16px;font-size:.88rem;font-weight:700}
.sbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.sbtn:disabled{opacity:.45;cursor:default}

.fb{border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;border:1px solid}
.fb.ok{background:var(--okbg);border-color:var(--ok)}
.fb.close{background:var(--closebg);border-color:var(--close)}
.fb.ng{background:var(--ngbg);border-color:var(--ng)}
.fb .v{font-weight:900;font-size:1.2rem}
.fb .v small{font-family:var(--f-num);font-size:1.05rem;margin-left:8px}
.fb.ok .v{color:var(--ok)}.fb.close .v{color:var(--close)}.fb.ng .v{color:var(--ng)}
.fb .msg{font-size:.9rem;grid-column:1}
.fb .next{grid-column:2;grid-row:1 / span 2;border:0;border-radius:8px;background:var(--ink);color:var(--bg);font-weight:900;padding:12px 22px;font-size:1.05rem}
.fb .kbd{font-size:.68rem;opacity:.7;display:block;font-weight:400}

/* hint blocks */
.hint{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.blk{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;display:grid;justify-items:center;gap:4px;min-width:64px}
.blk .g{font-size:2.1rem;font-weight:900;line-height:1.15}
.blk .parts{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.jm{display:grid;justify-items:center;border-radius:5px;padding:2px 6px;font-size:1.05rem;font-weight:700;line-height:1.2}
.jm small{font-size:.66rem;font-weight:400;color:var(--muted);font-family:var(--f-ja)}
.jm.L{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.jm.V{background:color-mix(in srgb,var(--ok) 16%,transparent)}
.jm.T{background:color-mix(in srgb,var(--close) 20%,transparent)}
.jm.known small{color:var(--ok);font-weight:700}
.blk .shape{font-size:.66rem;color:var(--muted)}
.blk .kk{font-size:.9rem;font-weight:700}
.hint-note{flex-basis:100%;text-align:center;font-size:.8rem;color:var(--muted)}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(10,14,18,.5);z-index:20;display:grid;place-items:end center;padding:16px}
@media (min-width:640px){.ov{place-items:center}}
.ov[hidden]{display:none}
.sheet{background:var(--bg);color:var(--ink);border:1px solid var(--rule);border-radius:12px;width:min(600px,100%);max-height:86vh;overflow:auto;padding:18px;box-shadow:var(--shadow);display:grid;gap:14px;align-content:start}
.sheet h3{margin:0;font-size:1.1rem;display:flex;align-items:center;gap:8px}
.sheet h3 .tbtn{margin-left:auto}
.opt{display:grid;gap:6px}
.opt .ol{font-size:.8rem;color:var(--muted);font-weight:700}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{flex:1 1 auto;border:0;background:var(--sign);padding:8px 10px;font-weight:700;min-width:5em}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--sign)}
.fontprev{font-size:1.4rem;font-weight:700;text-align:center;padding:4px;color:var(--muted)}
.danger{border:1px solid var(--ng);color:var(--ng);background:none;border-radius:8px;padding:8px;font-weight:700}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:5px 14px;font-weight:700;font-size:.88rem}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.coll h4{margin:6px 0 4px;font-size:.8rem;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.coll h4 span{margin-left:auto;font-family:var(--f-num);font-size:1rem;color:var(--ink)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid var(--rule)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:5px}
.cell{background:var(--sign);border:2px solid var(--lv0);border-radius:6px;padding:4px 2px;text-align:center;display:grid;line-height:1.2}
.cell b{font-size:1.35rem}
.cell span{font-size:.68rem;color:var(--muted)}
.cell.l1{border-color:var(--lv1);background:color-mix(in srgb,var(--lv1) 22%,var(--sign))}
.cell.l2{border-color:var(--lv2);background:color-mix(in srgb,var(--lv2) 22%,var(--sign))}
.cell.void{border-style:dashed;opacity:.5}
.stgrid{display:flex;flex-wrap:wrap;gap:5px}
.badge{border:2px solid var(--c);border-radius:999px;padding:2px 10px;font-size:.88rem;font-weight:700;background:var(--sign)}
.badge.got{background:var(--c);color:#fff}
.badge.no{border-style:dashed;color:var(--muted);opacity:.6}
.result{text-align:center;justify-items:center}
.result .big{font-size:1.6rem;font-weight:900;line-height:1.2}
.result .score{font-family:var(--f-num);font-size:3.4rem;font-variant-numeric:tabular-nums;line-height:1}
.result .sub{color:var(--muted);font-size:.9rem}
.result .stats{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:.9rem}
.result .stats b{font-family:var(--f-num);font-size:1.3rem}
.cert{border:3px double var(--accent);border-radius:10px;padding:14px;width:100%}
.cert .ttl{font-size:1.4rem;font-weight:900}
.rowbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pbtn{border:0;border-radius:8px;background:var(--accent);color:var(--sign);font-weight:900;padding:10px 20px}
.gbtn{border:1px solid var(--rule);border-radius:8px;background:var(--sign);font-weight:700;padding:10px 20px}
/* developer page */
.wrap.wide{max-width:1400px}
.muted{color:var(--muted)}
.devbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.devsel,.devin{font:inherit;padding:7px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--sign);color:var(--ink);min-width:0}
.devin{flex:1 1 200px}
.devchk{font-size:.88rem;white-space:nowrap}
.devsum{font-weight:700;margin-right:auto}
.devmsg{font-size:.82rem;color:var(--ok)}
.devta,.devmemo,.devnote{width:100%;font:inherit;font-size:.9rem;background:var(--sign);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:8px 10px}
.devta{height:140px;font:12px/1.4 ui-monospace,monospace;margin-bottom:10px}
.devmemo{margin-bottom:10px;resize:vertical}
.devnote{resize:vertical;border-color:var(--close)}
.devgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.dtile{background:var(--sign);border:1px solid var(--rule);border-top:5px solid var(--c);border-radius:8px;padding:10px 12px;display:grid;gap:6px;align-content:start;min-width:0}
.dtile.hit-ok{background:var(--okbg);border-color:var(--ok);border-top-color:var(--c)}
.dtile.hit-close{background:var(--closebg);border-color:var(--close);border-top-color:var(--c)}
.dtile.noted{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--close) 60%,transparent)}
.dthead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.dthead .num{font-family:var(--f-num);font-weight:700;font-size:1.05rem}
.dtname{font-weight:900;font-size:1.25rem;min-width:0;overflow-wrap:anywhere}
.dtline{font-size:.72rem;color:var(--muted)}
.nbtn{margin-left:auto;border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:1px 10px;font-size:.78rem}
.nbtn.has{border-color:var(--close);color:var(--close);font-weight:700}
.dtforms{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;margin:0;font-size:.92rem}
.dtforms dt{font-size:.7rem;color:var(--muted);padding-top:.2em}
.dtforms dd{margin:0;overflow-wrap:anywhere}
.dtforms dd.num{font-family:var(--f-num);font-size:1rem}
.dtex{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.dtlbl{font-size:.68rem;font-weight:700;margin-right:4px}
.dtlbl.ok{color:var(--ok)}.dtlbl.close{color:var(--close)}
.dex{display:inline-block;border-radius:4px;padding:0 5px;font-size:.82rem}
.dex.ok{background:var(--okbg);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.dex.close{background:var(--closebg);border:1px solid color-mix(in srgb,var(--close) 40%,transparent)}
.dchip{display:inline-block;border-radius:999px;padding:0 8px;font-size:.75rem;font-weight:700;margin:1px}
.dchip.ok{background:var(--ok);color:var(--bg)}
.dchip.close{background:var(--close);color:var(--bg)}
@media (prefers-reduced-motion:no-preference){
  .sign.flip{animation:flip .3s ease}
  @keyframes flip{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
}
</style>
</head>
<body>

<header class="bar"><div class="bar-in">
  <button class="logo" id="logo" type="button">えきよみ <small lang="ko">역읽기</small></button>
  <div class="bar-btns">
    <button class="tbtn" id="bColl" type="button" hidden></button>
    <button class="tbtn" id="bSet" type="button"></button>
  </div>
</div></header>
<main class="wrap" id="main"></main>
<div class="ov" id="ov" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
/* ===== えきよみ core: data + transliteration + judging ===== */
(function (G) {
'use strict';

/* ---------- kana utils ---------- */
const toHira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const toKata = s => s.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
const SMALL_Y = 'ゃゅょ';

const ROMA = {

/* split hiragana into morae (keeps ん, っ, ー as their own tokens) */
function morae(h) {
  const out = [];
  for (let i = 0; i < h.length; i++) {
    const c = h[i];
    if (SMALL_Y.includes(h[i + 1])) { out.push(c + h[i + 1]); i++; }
    else out.push(c);
  }
  return out;
}
function moraRoma(m) {
  if (m.length === 2) {
    const base = ROMA[m[0]] || '';
    const v = { ゃ:'a', ゅ:'u', ょ:'o' }[m[1]];
    if (base === 'shi') return 'sh' + v;
    if (base === 'chi') return 'ch' + v;
    if (base === 'ji') return 'j' + v;
    return base.slice(0, -1) + 'y' + v;
  }
  return ROMA[m] || '';
}
const vowelOf = m => { const r = moraRoma(m); return r ? r[r.length - 1] : ''; };

/* Hepburn, long vowels folded for display (Tokyo, Otemachi) */
function hepburn(h) {
  const ms = morae(toHira(h));
  let s = '';
  for (let i = 0; i < ms.length; i++) {
    const m = ms[i];
    if (m === 'っ') {
      const nx = moraRoma(ms[i + 1] || '');
      s += nx.startsWith('ch') ? 't' : (nx[0] || '');
    } else if (m === 'ー') {
    } else s += moraRoma(m);
  }
  return s;
}
function romaDisplay(h) {
  let s = hepburn(h).replace(/ou/g, 'o').replace(/oo/g, 'o').replace(/uu/g, 'u');
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function decompose(ch) {
  const c = ch.charCodeAt(0) - 0xAC00;
  if (c < 0 || c > 11171) return null;
  return { L: Math.floor(c / 588), V: Math.floor((c % 588) / 28), T: c % 28 };
}
const compose = (L, V, T) => String.fromCharCode(0xAC00 + (L * 21 + V) * 28 + (T || 0));
function addFinal(syl, T) {
  const d = decompose(syl);
  if (!d || d.T) return syl;
  return compose(d.L, d.V, T);
}

/* returns [{h:'긴', k:'ぎん'}...] one entry per Hangul block */
function kanaChunks(kana, keepLong) {
  const ms = morae(toHira(kana));
  const out = [];
  let prevV = '';
  for (const m of ms) {
    const last = out[out.length - 1];
    if (m === 'ー') { if (last) last.k += m; continue; }
    if (m === 'ん') { if (last) { last.h = addFinal(last.h, 4); last.k += m; } continue; }
    if (m === 'っ') { if (last) { last.h = addFinal(last.h, 19); last.k += m; } continue; }
    if (!keepLong && last && ((m === 'う' && (prevV === 'o' || prevV === 'u')) || (m === 'お' && prevV === 'o'))) {
      last.k += m; continue; // long vowel: not written in Hangul
    }
    const e = KH[m];
    if (!e) continue;
    const h = Array.isArray(e) ? e[out.length === 0 ? 0 : 1] : e;
    out.push({ h, k: m });
    prevV = vowelOf(m);
  }
  return out;
}
const kanaToHangul = k => kanaChunks(k).map(c => c.h).join('');

/* ---------- loose keys for judging ---------- */
const LGRP = { 0:'g',1:'g',15:'g', 3:'d',4:'d',16:'d', 7:'b',8:'b',17:'b', 12:'j',13:'j',14:'j', 9:'s',10:'s' };
const VJ_FOLD = { 2:0, 6:4, 12:8, 17:13 }; // ㅑㅕㅛㅠ -> ㅏㅓㅗㅜ after ㅈ-group
function hangulSyls(s) {
  const out = [];
  for (const ch of s) { const d = decompose(ch); if (d) out.push(d); }
  return out;
}
function looseH(s, very) {
  const syls = hangulSyls(s);
  const keys = [];
  let prevV = -1;
  for (const d of syls) {
    let L = LGRP[d.L] !== undefined ? LGRP[d.L] : String(d.L);
    let V = d.V;
    if (L === 'j' && VJ_FOLD[V] !== undefined) V = VJ_FOLD[V];
    if (V === 1) V = 5; if (V === 3) V = 7;
    if (V === 18 && (L === 's' || L === 'j')) L = 'z';
    let T = d.T;
    if (T === 7 || T === 20) T = 19;
    if (very) {
      if (T === 19) T = 0;
      if (d.L === 11 && d.V === 13 && !d.T && [8, 12, 13, 17].includes(prevV)) { prevV = d.V; continue; }
    }
    keys.push(L + '.' + V + '.' + T);
    prevV = d.V;
  }
  return keys.join('|');
}
const hasHangul = s => /[가-힣]/.test(s);

/* collapse Japanese long vowels so とうきょう = とーきょー = ときょう */
function collapseKana(s) {
  const ms = morae(toHira(s).replace(/[\s・･]/g, ''));
  let out = '', prevV = '';
  for (const m of ms) {
    if (m === 'ー') continue;
    if ((m === 'う' && (prevV === 'o' || prevV === 'u')) || (m === 'お' && prevV === 'o')) continue;
    out += m;
    if (m !== 'っ' && m !== 'ん') prevV = vowelOf(m);
  }
  return out;
}
/* very loose kana for Korean station names typed by Japanese users */
function looseKanaKR(s) {
  let h = toHira(s).replace(/[\sー・･っ]/g, '').replace(/を/g, 'お').replace(/[じぢ]/g, 'ち').replace(/[ずづ]/g, 'つ');
  h = h.normalize('NFD').replace(/[゙゚]/g, '').normalize('NFC');
  return h;
}
function romaJP(s) {
  let r = s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z]/g, '');
  r = r.replace(/shi/g, 'si').replace(/chi/g, 'ti').replace(/tsu/g, 'tu').replace(/fu/g, 'hu').replace(/ji/g, 'zi')
       .replace(/tch/g, 'tty').replace(/sh/g, 'sy').replace(/ch/g, 'ty').replace(/j/g, 'zy')
       .replace(/m(?=[bmp])/g, 'n')
       .replace(/ou/g, 'o').replace(/oo/g, 'o').replace(/uu/g, 'u').replace(/oh(?![aiueoy])/g, 'o');
  return r;
}
function romaKR(s) {
  let r = s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
  r = r.replace(/wae/g, 'we').replace(/oe/g, 'we').replace(/eo/g, 'o').replace(/eu/g, 'u').replace(/ae/g, 'e').replace(/ui/g, 'i')

       .replace(/(.)\1+/g, '$1');

}

/* long vowels kept as ':' so とうきょう = とーきょー but ≠ ときょ */
function strictKana(s) {
  const ms = morae(toHira(s).replace(/[\s・･]/g, ''));
  let out = '', prevV = '';
  for (const m of ms) {
    if (m === 'ー') { out += ':'; prevV = ''; continue; }
    if ((m === 'う' && (prevV === 'o' || prevV === 'u')) || (m === 'お' && prevV === 'o')) { out += ':'; prevV = ''; continue; }
    out += m;
    prevV = (m === 'っ' || m === 'ん') ? '' : vowelOf(m);
  }

}

function judge(mode, st, raw) {
  const a = (raw || '').trim();
  if (!a) return null;
  const isRoma = /[a-z]/i.test(a) && !hasKana(a) && !hasHangul(a);
  if (st.country === 'jp') {
    const ok =
      (hasKana(a) && strictKana(a) === strictKana(st.kana)) ||
      [st.name, ...st.alt].some(n => normKanji(n) === normKanji(a)) ||
      (isRoma && romaJP(a) === romaJP(hepburn(st.kana))) ||
      (hasHangul(a) && looseH(a) === looseH(st.hangul));
    if (ok) return 'ok';
    if (/^[ぁ-ゖァ-ヺー\s・･]+$/.test(a)) {
      if (collapseKana(a) === collapseKana(st.kana)) return 'close';
      if (mode === 'ja' && looseH(kanaToHangul(a)) === looseH(st.hangul)) return 'close';
    }
    if (hasHangul(a) && looseH(a, true) === looseH(st.hangul, true)) return 'close';
    return 'ng';
  } else {
    const ok =
      (hasHangul(a) && st.koAlt.some(k => looseH(k) === looseH(a))) ||
      (isRoma && st.rrAlt.some(r => rrStrict(r) === rrStrict(a))) ||
      (hasKana(a) && looseKanaKR(a) === looseKanaKR(st.kata));
    if (ok) return 'ok';
    if (isRoma && st.rrAlt.some(r => romaKR(r) === romaKR(a))) return 'close'; // older McCune-Reischauer etc.
    if (hasHangul(a) && st.koAlt.some(k => looseH(k, true) === looseH(a, true))) return 'close';
    return 'ng';
  }
}

function hangulUnits(hs) {
  const out = [];
  for (const c of hs) { const d = decompose(c); if (!d) continue;

}

function moraeAny(str) {

}

}

function moraHangul(m) {
  const h = toHira(m);
  if (h === 'ん') return 'ㄴ';
  if (h === 'っ') return 'ㅅ';
  if (h === 'ー') return '—';

  return st.hangul;
}
function unitsOf(st) {
  const u = D.lang === 'ja' ? E.hangulUnits(st.hangul) : E.kanaUnits(question(st).text);
  return [...new Set(u)];
}

function applyLook() {
  const root = document.documentElement;
  root.setAttribute('data-theme', D.theme === 'dark' ? 'dark' : 'light');
  const fj = FONTS.ja.find(f => f[0] === D.fja) || FONTS.ja[0];
  const fk = FONTS.ko.find(f => f[0] === D.fko) || FONTS.ko[0];
  root.style.setProperty('--gf-ja', '"' + fj[2] + '", var(--f-ja)');
  root.style.setProperty('--gf-ko', '"' + fk[2] + '", var(--f-ko)');
  root.lang = uiLang();
}

/* ---------- state ---------- */
let S = { view:'start' };

/* ---------- header ---------- */
function renderBar() {
  const T = t(), inGame = !!D.lang && S.view !== 'start' && S.view !== 'dev';
  $('main').classList.toggle('wide', S.view === 'dev');
  const lg = $('logo'), ko = uiLang() === 'ko';
  lg.replaceChildren(ko ? h('span', { lang:'ko' }, '역읽기') : h('span', { lang:'ja' }, 'えきよみ'), h('small', { lang: ko ? 'ja' : 'ko' }, ko ? 'えきよみ' : '역읽기'));

  $('bColl').hidden = !inGame;
  $('bColl').textContent = T.coll; $('bSet').textContent = T.set;
  applyLook();
}

/* ---------- start ---------- */
function viewStart() {
  stopTimer(); S = { view:'start' }; D.lang = null; save(); renderBar();
  const main = D.ui || detectLang() || 'ja';
  const m = $('main'); m.replaceChildren();
  // only the card for the language on screen can be chosen; the other is greyed out
  const NOTE = { ja:'下の「日本語で表示」を押すと選べる', ko:'아래 「한국어로 보기」를 누르면 선택할 수 있어요' };
  const pickBtn = (lang, who, what, q, a, c) => h('button', { type:'button', lang, disabled: lang !== main, 'aria-disabled': String(lang !== main),
      onclick:() => { if (lang !== main) return; D.lang = lang; D.ui = lang; save(); viewLines(); } },
    h('span', { class:'who' }, who),
    h('span', { class:'mini' },
      h('span', { class:'ms glyph', style:'--c:' + c, lang: lang === 'ja' ? 'ko' : 'ja' }, q),
      h('span', { class:'arrow' }, '→'),
      h('span', { class:'ans' }, a)),
    h('span', { class:'what' }, what),
    lang !== main ? h('span', { class:'pnote' }, NOTE[lang]) : null);

  const koPick = pickBtn('ko', '한국어로 하기', '역 이름의 가타카나 읽기. 서울 1·2호선, 부산 1호선부터', 'ミョンドン', '명동?', LINES.seoul2.color);
  // the title names only the other country's script; the second line is its translation
  const H = {
    ja: { main:'ハングルの駅名ぐらいはサッと読めるようになるための練習アプリ', sub:'한글 역 이름 정도는 바로 읽을 수 있게 되는 연습 앱' },
    ko: { main:'가타카나·히라가나 역 이름 정도는 바로 읽을 수 있게 되는 연습 앱', sub:'カタカナ・ひらがなの駅名ぐらいはサッと読めるようになるための練習アプリ' }
  };
  const other = main === 'ja' ? 'ko' : 'ja';
  m.append(
    h('section', { class:'hero' },
      h('h1', { lang:main }, H[main].main),
      h('p', { class:'sub1', lang:other }, H[main].sub)),
    h('div', { class:'pick' }, main === 'ja' ? [jaPick, koPick] : [koPick, jaPick]),
    h('div', { class:'how' },
      [main, other].map(l => h('div', { lang:l }, h('b', null, TXT[l].howTitle), ' ', TXT[l].how))),
    h('div', { class:'subrow', style:'margin-top:18px' },

/* ---------- line select ---------- */
function viewLines(flash) {
  stopTimer(); S = { view:'lines' }; renderBar();
  const T = t(), m = $('main'); m.replaceChildren();
  if (flash) m.append(h('div', { class:'fb ok', style:'margin-top:16px' }, h('div', { class:'v' }, flash)));
  [1, 2].forEach(stg => {
    const ids = ORDER[D.lang].filter(id => stageOf(id) === stg);
    const locked = stg === 2 && !stage1Done() && !D.openAll;
    const sec = h('section', { class:'stage' },
      h('h2', null, stg === 1 ? T.st1 : T.st2),
      h('p', { class:'lock' }, locked ? '🔒 ' + T.locked : (stg === 1 ? T.st1sub : T.st2sub)));
    const list = h('div', { class:'lines' });
    ids.forEach(id => {
      const L = LINES[id], n = L.stations.length, c = badgeCount(id), b = D.best[D.lang][id];
      list.append(h('button', { type:'button', class:'lcard', style:'--c:' + L.color, disabled:locked, onclick:() => startRun(id) },
        symEl(id),
        h('span', { style:'min-width:0' },
          h('span', { class:'lname' }, lineName(id)),
          h('span', { class:'lsub' }, ' ' + T.badges + ' ' + c + '/' + n),
          h('span', { class:'meter' }, h('i', { style:'width:' + (c / n * 100) + '%' }))),
        h('span', { class:'lstat' }, c >= n ? h('span', { class:'done-badge' }, '✓ ' + T.cleared) : c + '/' + n,
          b != null ? h('small', null, T.best + ' ' + b + T.pt) : null)));
    });
    sec.append(list); m.append(sec);
  });
}

/* ---------- run ---------- */
function buildQueue(excludeIdx) {
  const L = LINES[S.line], got = badges(S.line);
  const fresh = shuffle(L.stations.filter(s => !got[s.idx] && s.idx !== excludeIdx).map(s => s.idx));
  const old = shuffle(L.stations.filter(s => got[s.idx] && s.idx !== excludeIdx).map(s => s.idx));
  return fresh.concat(old);
}
function startRun(id) {
  S = { view:'play', line:id, queue:[], score:0, streak:0, stats:{ ok:0, close:0, ng:0 }, newB:[],
        s1Before: stage1Done(), clearedBefore: isCleared(id), t0: Date.now(), over:false };
  S.end = S.t0 + RUN_MS;
  S.queue = buildQueue(-1);
  renderBar(); startTimer(); nextQ();
}
function startTimer() {
  stopTimer();
  S.timer = setInterval(() => {
    if (S.view !== 'play' || S.over) return;
    const left = S.end - Date.now();
    const el = $('htime');
    if (el) { el.textContent = fmt(left); el.parentNode.classList.toggle('low', left < 20000); }
    if (left <= 0) endRun('time');
  }, 250);
}
function stopTimer() { if (S && S.timer) clearInterval(S.timer); if (S) S.timer = null; }

function nextQ() {
  if (S.over) return;
  if (!S.queue.length) S.queue = buildQueue(S.cur ? S.cur.idx : -1);
  S.cur = LINES[S.line].stations[S.queue.shift()];
  Object.assign(S, { done:false, hintOpen:false, hintUsed:false, cut:false, choiceSet:null, picked:null, lastInput:null, result:null, gain:0 });
  renderPlay();
}

function renderPlay() {
  const T = t(), L = LINES[S.line], st = S.cur, m = $('main');
  m.replaceChildren();
  const q = question(st);
  const got = badges(S.line);

  m.append(h('div', { class:'ptop', style:'--c:' + L.color },
    h('button', { class:'back', type:'button', onclick:() => viewLines() }, '‹ ' + T.toLines),
    h('span', { class:'pline' }, symEl(S.line), lineName(S.line)),
    h('button', { class:'quit', type:'button', onclick:() => endRun('quit') }, T.quit)));

  const left = S.end - Date.now();
  m.append(h('div', { class:'hud' },
    h('div', { class: left < 20000 ? 'low' : null }, h('small', null, T.time), h('b', { id:'htime' }, fmt(left))),
    D.answer === 'choice' ? h('div', null, h('small', null, T.correctN), h('b', null, S.stats.ok + S.stats.close)) : h('div', null, h('small', null, T.score), h('b', null, S.score)),
    h('div', null, h('small', null, T.streak), h('b', null, S.streak)),
    h('div', null, h('small', null, T.got), h('b', null, badgeCount(S.line) + '/' + L.stations.length))));

  // strip: lit = badge collected; the current station is shown only after answering
  const strip = h('div', { class:'strip', style:'--c:' + L.color, 'aria-hidden':'true' });
  L.sections.forEach((lab, si) => {
    const row = h('div', { class:'strip-sec' });
    if (lab) row.append(h('span', { class:'lbl' }, lab[D.lang]));
    L.stations.filter(s => s.section === si).forEach(s => {
      row.append(h('span', { class:'dot' + (got[s.idx] ? ' lit' : '') + (S.done && s === st ? ' now' : '') }));
    });
    strip.append(row);
  });
  m.append(strip);

  // sign: station number hidden until answered
  const len = [...q.text].length;
  let codeEl;
  if (L.country === 'jp') {
    const letter = st.code.replace(/\d+/, ''), num = st.code.replace(/\D+/, '');
    codeEl = h('div', { class:'code' }, h('span', { class:'cl' }, letter), h('span', { class:'cn' + (S.done ? '' : ' hide') }, S.done ? num : '??'));
  } else codeEl = h('div', { class:'code kr' }, h('span', { class:'cn' + (S.done ? '' : ' hide') }, S.done ? st.code : '??'));
  const foot = h('div', { class:'sign-foot' });
  if (S.done) {
    if (st.country === 'jp') foot.append(h('span', { class:'k glyph', lang:'ja' }, st.name), h('span', { class:'s glyph', lang:'ja' }, D.lang === 'ja' ? st.kana : kanaDisp(st.kana)), h('span', { class:'s glyph', lang:'ko' }, st.hangul));
    else foot.append(h('span', { class:'k glyph', lang:'ko' }, st.name), h('span', { class:'s glyph', lang:'ja' }, D.lang === 'ja' ? E.toKata(st.kata) : kanaDisp(st.kata)));
    foot.append(h('span', { class:'r' }, st.roma));
  } else foot.append(h('span', { class:'hidden' }, '・・・'));
  m.append(h('div', { class:'sign flip', style:'--c:' + L.color },
    h('div', { class:'sign-band' }),
    h('div', { class:'sign-body' }, codeEl, h('div', { class:'q glyph' + (len > 9 ? ' xlong' : len > 5 ? ' long' : ''), lang:q.lang }, q.text)),
    foot));

  // action area right under the sign: answer UI, or the result with a big Next button
  const act = h('div', { class:'act' });
  if (S.done) {
    const r = S.result, a = answerText(st);
    act.append(h('div', { class:'fb ' + r, role:'status' },
      h('div', { class:'v' }, r === 'ok' ? T.ok : r === 'close' ? T.close : T.ng, S.gain ? h('small', null, '+' + S.gain) : null),
      r === 'close' ? h('div', { class:'msg' }, T.closeMsg(a)) : r === 'ng' ? h('div', { class:'msg' }, T.ngMsg(a)) : h('div', { class:'msg' }),
      h('button', { class:'next', type:'button', id:'nextBtn', onclick:nextQ }, T.next + ' ›', h('span', { class:'kbd' }, T.enter))));
  } else {
    act.append(h('p', { class:'prompt' }, T.prompt));
    if (D.answer === 'choice') {
      if (!S.choiceSet) {
        const pool = shuffle(L.stations.filter(s => answerText(s) !== answerText(st)));
        const seen = new Set([answerText(st)]), opts = [st];
        for (const s of pool) { if (opts.length >= 4) break; if (!seen.has(answerText(s))) { seen.add(answerText(s)); opts.push(s); } }
        S.choiceSet = shuffle(opts);
        S.gone = new Set(shuffle(opts.filter(o => o !== st)).slice(0, 2));
      }
      const box = h('div', { class:'choices' });
      S.choiceSet.forEach(s => {
        const gone = S.cut && S.gone.has(s);
        box.append(h('button', { type:'button', class:'glyph' + (gone ? ' gone' : ''), lang: D.lang === 'ja' ? 'ja' : 'ko', disabled:gone,
          onclick:() => { S.picked = s; answer(s === st ? 'ok' : 'ng'); } }, answerText(s)));
      });
      act.append(box);
    } else {
      const inp = h('input', { id:'ans', type:'text', autocomplete:'off', autocapitalize:'off', spellcheck:'false', placeholder:T.ph, lang: D.lang === 'ja' ? 'ja' : 'ko', 'aria-label':T.prompt });
      act.append(h('form', { class:'ansrow', onsubmit:e => { e.preventDefault(); const r = E.judge(D.lang, st, inp.value); if (r) answer(r, inp.value); } },
        inp, h('button', { class:'go', type:'submit' }, T.go)));
    }
    const sub = h('div', { class:'subrow' },
      h('button', { class:'sbtn', type:'button', 'aria-pressed': String(S.hintOpen), onclick:toggleHint }, S.hintOpen ? T.hintClose : '💡 ' + T.hintBtn));
    if (D.answer === 'choice' && S.hintUsed) sub.append(h('button', { class:'sbtn', type:'button', disabled:S.cut, onclick:() => { S.cut = true; renderPlay(); } }, '✂ ' + T.cut));
    sub.append(h('button', { class:'sbtn', type:'button', onclick:skip }, T.skip + ' ›'));
    act.append(sub);
  }
  m.append(act);
  if (S.hintOpen || S.done) { const hn = renderHint(st); hn.style.marginTop = '12px'; m.append(hn); }

  setTimeout(() => {
    if (S.view !== 'play' || !$('ov').hidden) return;
    if (S.done) { const b = $('nextBtn'); if (b) b.focus({ preventScroll:true }); }
    else { const i = $('ans'); if (i) i.focus({ preventScroll:true }); }
  }, 30);
}

function toggleHint() {
  S.hintOpen = !S.hintOpen;
  if (S.hintOpen) S.hintUsed = true;
  const v = $('ans') ? $('ans').value : '';
  renderPlay();
  if ($('ans')) $('ans').value = v;
}

function renderHint(st) {
  const T = t(), box = h('div', { class:'hint' });
  if (D.lang === 'ja') {
    const chars = [...st.hangul].filter(c => E.decompose(c));
    chars.forEach((c, i) => {
      const b = E.blockInfo(c);
      const part = (cls, j, snd, unit) => {
        const k = level(unit) === 2 && !S.done;
        return h('span', { class:'jm ' + cls + (k ? ' known' : ''), lang:'ko' }, j, h('small', null, k ? T.known : snd));
      };
      const kk = st.country === 'jp' && st.chunks[i] && S.done ? E.toKata(st.chunks[i].k) : null;
      box.append(h('div', { class:'blk' },
        h('span', { class:'g glyph', lang:'ko' }, c),
        h('span', { class:'parts' },
          part('L', b.L, b.Lsnd, 'L:' + b.L), part('V', b.V, b.Vsnd, 'V:' + b.V),
          b.T ? part('T', b.T, b.Tsnd, 'T:' + b.T) : null),
        h('span', { class:'shape' }, T.shape[b.shape] + (b.T ? T.fin : '')),
        kk ? h('span', { class:'kk' }, kk) : null));
    });
    box.append(h('span', { class:'hint-note' }, T.hintNote));
    if (st.country === 'kr') box.append(h('span', { class:'hint-note' }, T.hintNoteKR));
  } else {
    const q = question(st).text;
    E.moraeAny(q).forEach(mo => {
      const unit = (/[ァ-ヺ]/.test(mo) ? 'K:' : 'H:') + mo;
      const k = mo !== 'ー' && level(unit) === 2 && !S.done;
      box.append(h('div', { class:'blk' },
        h('span', { class:'g glyph', lang:'ja', style:'font-size:1.6rem' }, mo),
        h('span', { class:'jm L' + (k ? ' known' : ''), lang:'ko', style:'font-size:1.2rem' }, k ? T.known : E.moraHangul(mo))));
    });
    box.append(h('span', { class:'hint-note' }, st.country === 'kr' ? T.hintNoteKR : T.hintNote));
  }
  return box;
}

function answer(r, raw) {
  if (S.done || S.over) return;
  S.done = true; S.result = r; S.lastInput = raw;
  const st = S.cur, units = unitsOf(st), K = know();
  if (r === 'ok' || r === 'close') {
    S.stats[r]++;
    S.streak++;
    let g = r === 'ok' ? 10 : 5;
    if (S.hintUsed) g = Math.floor(g / 2);
    if (S.streak >= 3) g += 2;
    if (D.answer === 'choice') { S.gain = 0; S.usedChoice = true; } else { S.gain = g; S.score += g; }
    const got = badges(S.line);
    if (!got[st.idx]) { got[st.idx] = 1; S.newB.push(st.idx); }
    const add = D.answer === 'choice' ? PTS.choice : PTS.input;
    units.forEach(u => {
      const shown = S.hintUsed && level(u) < 2;
      K[u] = Math.min(99, (K[u] || 0) + (shown ? PTS.hinted : add));
    });
  } else {
    S.stats.ng++; S.streak = 0; S.gain = 0; if (D.answer === 'choice') S.usedChoice = true;
    units.forEach(u => { if ((K[u] || 0) > PTS.learned) K[u] = PTS.learned; });
  }
  save();
  renderPlay();
}
function skip() { S.streak = 0; nextQ(); }

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('ov').hidden) { closeOv(); return; }
  if (e.key === 'Enter' && !e.repeat && S.view === 'play' && S.done && !S.over && $('ov').hidden) {
    e.preventDefault(); nextQ();
  }
});

function endRun(why) {
  if (S.over) return;
  S.over = true; stopTimer();
  const T = t(), id = S.line, L = LINES[id];
  const bests = D.best[D.lang];
  const scored = !S.usedChoice;
  const newBest = scored && (bests[id] == null || S.score > bests[id]);
  if (newBest && (S.score > 0 || why === 'time')) bests[id] = S.score;
  save();
  const nowCleared = isCleared(id) && !S.clearedBefore;
  const all = ORDER[D.lang].every(isCleared);
  const unlocked = !S.s1Before && stage1Done() && !D.openAll;
  const sh = $('sheet'); sh.replaceChildren(); sh.className = 'sheet result';
  sh.append(
    h('span', { style:'--c:' + L.color }, symEl(id)),
    h('div', { class:'big' }, why === 'time' ? T.timeUp : T.quitT),
    scored ? h('div', { class:'score' }, S.score, h('small', { style:'font-size:1.2rem' }, T.pt))
           : h('div', { class:'score' }, S.stats.ok + S.stats.close, h('small', { style:'font-size:1.2rem' }, T.qUnit)),
    scored ? null : h('div', { class:'sub' }, T.practice),
    newBest && S.score > 0 ? h('div', { class:'sub', style:'color:var(--ok);font-weight:900' }, T.newBest) : null,
    h('div', { class:'stats' },
      h('span', null, T.statOk + ' ', h('b', null, S.stats.ok)),
      h('span', null, T.statClose + ' ', h('b', null, S.stats.close)),
      h('span', null, T.statNg + ' ', h('b', null, S.stats.ng))),
    h('div', { class:'sub' }, T.newBadges(S.newB.length) + ' · ' + T.badges + ' ' + badgeCount(id) + '/' + L.stations.length));
  if (S.newB.length) sh.append(h('div', { class:'stgrid', style:'justify-content:center;--c:' + L.color },
    S.newB.map(i => h('span', { class:'badge got glyph', lang: L.country === 'jp' ? 'ja' : 'ko' }, L.stations[i].name))));
  if (nowCleared) sh.append(h('div', { class:'fb ok', style:'width:100%' }, h('div', { class:'v' }, '🎉 ' + T.lineClear(lineName(id)))));
  if (all && nowCleared) sh.append(h('div', { class:'cert' }, h('div', { class:'ttl' }, '🏅 ' + T.master), h('div', { class:'sub' }, T.masterSub)));
  else if (unlocked) sh.append(h('div', { class:'fb ok', style:'width:100%' }, h('div', { class:'v', style:'font-size:1rem' }, T.unlock)));
  sh.append(h('div', { class:'rowbtns' },
    h('button', { class:'pbtn', type:'button', onclick:() => { closeOv(); startRun(id); } }, T.again),
    h('button', { class:'gbtn', type:'button', onclick:() => { closeOv(); showColl(); } }, T.collBtn),
    h('button', { class:'gbtn', type:'button', onclick:() => { closeOv(); viewLines(); } }, T.toLinesBtn)));
  viewLines();
  openOv();
}

/* ---------- developer page (logo x5) ---------- */
function longBar(kana) {           // とうきょう -> とーきょー
  const ms = E.morae(E.toHira(kana)); let out = '', prev = '';
  for (const m of ms) {
    const r = E.hepburn(m), v = r ? r[r.length - 1] : '';
    if ((m === 'う' && (prev === 'o' || prev === 'u')) || (m === 'お' && prev === 'o')) { out += 'ー'; prev = ''; continue; }
    out += m; prev = (m === 'っ' || m === 'ん') ? '' : v;
  }
  return out;
}
function dropLong(kana) { return longBar(kana).replace(/ー/g, ''); }
const VOICE = { か:'が',き:'ぎ',く:'ぐ',け:'げ',こ:'ご',さ:'ざ',し:'じ',す:'ず',せ:'ぜ',そ:'ぞ',た:'だ',ち:'ぢ',て:'で',と:'ど',は:'ば',ひ:'び',ふ:'ぶ',へ:'べ',ほ:'ぼ' };
const UNVOICE = Object.fromEntries(Object.entries(VOICE).map(([a, b]) => [b, a]));
function swapFirstVoice(kana) { const h0 = E.toHira(kana); const c = h0[0]; const r = VOICE[c] || UNVOICE[c]; return r ? r + h0.slice(1) : null; }
function hangulVariants(hs) {
  const out = new Set([hs, hs.replace(/쓰/g, '츠'), hs.replace(/초/g, '쵸').replace(/조/g, '죠').replace(/주/g, '쥬').replace(/추/g, '츄')]);
  const d = E.decompose(hs[0]);
  if (d) { const asp = { 0:15, 3:16, 12:14 }[d.L]; if (asp != null) out.add(String.fromCharCode(0xAC00 + (asp * 21 + d.V) * 28 + d.T) + hs.slice(1)); }
  return [...out];
}
function dropBatchimS(hs) { return [...hs].map(c => { const d = E.decompose(c); return d && d.T === 19 ? String.fromCharCode(0xAC00 + (d.L * 21 + d.V) * 28) : c; }).join(''); }
function mrStyle(rr) {
  const w = rr.replace(/eo/g, 'ŏ').replace(/eu/g, 'ŭ');
  return [w.replace(/^g/, 'k').replace(/^d/, 't').replace(/^b/, 'p').replace(/^j/, 'ch'),
          w.replace(/(?<!n)g/g, 'k').replace(/d/g, 't').replace(/b/g, 'p').replace(/j/g, 'ch')];
}
const cap = x => x.charAt(0).toUpperCase() + x.slice(1);
function examples(st) {
  const J = v => E.judge(/[가-힣]/.test(v) ? 'ko' : 'ja', st, v);
  let okC, closeC;
  if (st.country === 'jp') {
    const hep = E.hepburn(st.kana);
    const mac = hep.replace(/ou/g, 'ō').replace(/oo/g, 'ō').replace(/uu/g, 'ū');
    okC = [st.kana, E.toKata(st.kana), longBar(st.kana), E.toKata(longBar(st.kana)), st.name, ...st.alt, st.roma, hep, cap(mac), ...hangulVariants(st.hangul)];
    closeC = [dropLong(st.kana), E.toKata(dropLong(st.kana)), swapFirstVoice(st.kana), E.kanaChunks(st.kana, true).map(c => c.h).join(''), dropBatchimS(st.hangul)];
  } else {
    okC = [st.name, ...st.koAlt, st.kata, E.toHira(st.kata), st.roma, ...st.rrAlt];
    closeC = [...mrStyle(st.rrAlt[0]).map(cap), dropBatchimS(st.name)];
  }
  const uniq = a => [...new Set(a.filter(Boolean))];
  return { ok: uniq(okC).filter(v => J(v) === 'ok'), close: uniq(closeC).filter(v => J(v) === 'close') };
}
let devFilter = { line:'all', q:'', test:'', notes:false };
const NKEY = 'ekiyomi.devnotes';
let NOTES = { all:'', st:{} };
try { const n = JSON.parse(localStorage.getItem(NKEY) || 'null'); if (n) NOTES = Object.assign(NOTES, n); } catch(e) {}
NOTES.st = NOTES.st || {};
const saveNotes = () => { try { localStorage.setItem(NKEY, JSON.stringify(NOTES)); } catch(e) {} };

function viewDev() {
  stopTimer(); S = { view:'dev' }; renderBar();
  const m = $('main'); m.replaceChildren(); m.classList.add('wide');
  const ids = Object.keys(LINES);
  const rows = [];
  ids.forEach(id => LINES[id].stations.forEach(st => {
    rows.push({ id, st, key: id + ':' + st.idx, ex: examples(st),
      kana: st.country === 'jp' ? st.kana : E.toHira(st.kata), kata: st.country === 'jp' ? E.toKata(st.kana) : st.kata });
  }));
  const sel = h('select', { id:'devLine', class:'devsel' }, h('option', { value:'all' }, '全路線'), ids.map(id => h('option', { value:id }, LINES[id].name.ja)));
  sel.value = devFilter.line;
  const q = h('input', { id:'devQ', class:'devin', type:'search', placeholder:'しぼりこみ（どの表記でも）', value:devFilter.q });
  const test = h('input', { id:'devT', class:'devin', type:'text', placeholder:'ためし打ち：答えを入れると判定', value:devFilter.test, autocomplete:'off', spellcheck:'false' });
  const onlyNotes = h('label', { class:'devchk' }, h('input', { type:'checkbox', id:'devN', checked:devFilter.notes }), ' メモありだけ');
  const sum = h('div', { class:'devsum', role:'status' });
  const msg = h('span', { class:'devmsg', role:'status' });
  const grid = h('div', { class:'devgrid' });
  const ta = h('textarea', { class:'devta', hidden:true, readonly:true, 'aria-label':'コピー用テキスト' });
  const chip = (r, l) => r === 'ok' ? h('span', { class:'dchip ok' }, l + ' 正解') : r === 'close' ? h('span', { class:'dchip close' }, l + ' おしい') : null;
  const noteCount = () => Object.values(NOTES.st).filter(v => v && v.trim()).length;
  const memoAll = h('textarea', { id:'devMemo', class:'devmemo', placeholder:'全体メモ（駅に関係ない気づき）。書いたら自動で保存', rows:3 });
  memoAll.value = NOTES.all || '';
  memoAll.addEventListener('input', () => { NOTES.all = memoAll.value; saveNotes(); });

  function tile(r, rj, rk, hit) {
    const L = LINES[r.id], has = !!(NOTES.st[r.key] && NOTES.st[r.key].trim());
    const note = h('textarea', { class:'devnote', rows:2, placeholder:'この駅のメモ', hidden: !has && !r.open });
    note.value = NOTES.st[r.key] || '';
    const nbtn = h('button', { class:'nbtn' + (has ? ' has' : ''), type:'button', 'aria-label':'メモ', title:'メモ' }, has ? '📝 メモあり' : '📝');
    note.addEventListener('input', () => {
      NOTES.st[r.key] = note.value; if (!note.value.trim()) delete NOTES.st[r.key]; saveNotes();
      const hz = !!note.value.trim(); nbtn.textContent = hz ? '📝 メモあり' : '📝'; nbtn.classList.toggle('has', hz); card.classList.toggle('noted', hz);
    });
    nbtn.addEventListener('click', () => { r.open = note.hidden; note.hidden = !note.hidden; if (!note.hidden) note.focus(); });
    const card = h('div', { class:'dtile' + (hit ? ' hit-' + hit : '') + (has ? ' noted' : ''), style:'--c:' + L.color },
      h('div', { class:'dthead' },
        h('span', { class:'num' }, r.st.code),
        h('span', { class:'dtname glyph', lang: r.st.country === 'jp' ? 'ja' : 'ko' }, r.st.name),
        h('span', { class:'dtline' }, L.name.ja), nbtn),
      h('dl', { class:'dtforms' },
        h('dt', null, 'かな'), h('dd', { lang:'ja' }, r.kana + ' ／ ' + r.kata),
        h('dt', null, 'ハングル'), h('dd', { class:'glyph', lang:'ko' }, r.st.hangul),
        h('dt', null, 'ローマ字'), h('dd', { class:'num' }, r.st.roma)),
      h('div', { class:'dtex' }, h('span', { class:'dtlbl ok' }, '正解'), r.ex.ok.map(v => h('span', { class:'dex ok' }, v))),
      h('div', { class:'dtex' }, h('span', { class:'dtlbl close' }, 'おしい'), r.ex.close.length ? r.ex.close.map(v => h('span', { class:'dex close' }, v)) : h('span', { class:'muted' }, '—')),
      (rj || rk) ? h('div', { class:'dtex' }, chip(rj, '日'), chip(rk, '韓')) : null,
      note);
    return card;
  }
  function draw() {
    grid.replaceChildren();
    const fq = devFilter.q.trim().toLowerCase(), tv = devFilter.test.trim();
    let nOk = 0, nClose = 0, shown = 0;
    rows.forEach(r => {
      if (devFilter.line !== 'all' && r.id !== devFilter.line) return;
      if (devFilter.notes && !(NOTES.st[r.key] && NOTES.st[r.key].trim())) return;
      const hay = [r.st.name, r.kana, r.kata, r.st.hangul, r.st.roma, r.st.code, ...r.ex.ok, ...r.ex.close, NOTES.st[r.key] || ''].join(' ').toLowerCase();
      if (fq && !hay.includes(fq)) return;
      let rj = null, rk = null;
      if (tv) { rj = E.judge('ja', r.st, tv); rk = E.judge('ko', r.st, tv); }
      const hit = rj === 'ok' || rk === 'ok' ? 'ok' : rj === 'close' || rk === 'close' ? 'close' : '';
      if (hit === 'ok') nOk++; else if (hit === 'close') nClose++;
      if (tv && !hit) return;
      shown++;
      grid.append(tile(r, rj === 'ng' ? null : rj, rk === 'ng' ? null : rk, hit));
    });
    sum.textContent = (tv ? '「' + tv + '」→ 正解 ' + nOk + '駅 / おしい ' + nClose + '駅' : shown + '駅を表示中（全' + rows.length + '駅）') + ' ・ メモ ' + noteCount() + '件';
  }
  sel.addEventListener('change', () => { devFilter.line = sel.value; draw(); });
  q.addEventListener('input', () => { devFilter.q = q.value; draw(); });
  test.addEventListener('input', () => { devFilter.test = test.value; draw(); });
  onlyNotes.querySelector('input').addEventListener('change', e => { devFilter.notes = e.target.checked; draw(); });

  const copyText = (txt, okMsg) => {
    const fallback = () => { ta.hidden = false; ta.value = txt; ta.focus(); ta.select(); msg.textContent = '下の枠を選んでコピーして'; };
    try { navigator.clipboard.writeText(txt).then(() => { ta.hidden = true; msg.textContent = okMsg; }, fallback); } catch(e) { fallback(); }
  };
  const copyTsv = h('button', { class:'sbtn', type:'button', onclick:() => {
    const lines = [['路線','番号','表記','ひらがな','カタカナ','ハングル','ローマ字','正解になる例','おしいになる例','メモ'].join('\t')];
    rows.forEach(r => lines.push([LINES[r.id].name.ja, r.st.code, r.st.name, r.kana, r.kata, r.st.hangul, r.st.roma, r.ex.ok.join(' / '), r.ex.close.join(' / '), (NOTES.st[r.key] || '').replace(/\s+/g, ' ')].join('\t')));
    copyText(lines.join('\n'), '一覧をコピーした（' + rows.length + '駅）');
  } }, '一覧をコピー（TSV）');
  const copyNotes = h('button', { class:'sbtn', type:'button', onclick:() => {
    const out = ['【全体メモ】', (NOTES.all || '').trim() || '（なし）', '', '【駅メモ】'];
    const st = rows.filter(r => NOTES.st[r.key] && NOTES.st[r.key].trim());
    if (!st.length) out.push('（なし）');
    st.forEach(r => out.push('・' + LINES[r.id].name.ja + ' ' + r.st.code + ' ' + r.st.name + '：' + NOTES.st[r.key].trim()));
    copyText(out.join('\n'), 'メモをコピーした（駅メモ' + st.length + '件）');
  } }, '📝 メモをまとめてコピー');

  m.append(
    h('div', { class:'ptop' },
      h('button', { class:'back', type:'button', onclick:() => viewStart() }, '‹ タイトル'),
      h('span', { class:'pline' }, '🛠 開発者ページ')),
    h('p', { class:'muted', style:'margin:0 0 10px;font-size:.85rem' }, '例はルールから作って、実際の判定で確かめたものだけ表示。「日」は日本語版、「韓」は韓国語版の判定。メモはこのブラウザだけに保存。'),
    memoAll,
    h('div', { class:'devbar' }, sel, q, test, onlyNotes),
    h('div', { class:'devbar' }, sum, copyNotes, copyTsv, msg),
    ta, grid);
  draw();
}

/* ---------- overlays ---------- */
function openOv() { $('ov').hidden = false; const f = $('sheet').querySelector('button'); if (f) f.focus(); }
function closeOv() {
  $('ov').hidden = true; $('sheet').className = 'sheet';
  if (S.view === 'play') { const x = S.done ? $('nextBtn') : $('ans'); if (x) x.focus({ preventScroll:true }); }
}
$('ov').addEventListener('click', e => { if (e.target.id === 'ov') closeOv(); });

function seg(label, val, opts, onpick, langAttr) {
  return h('div', { class:'opt' }, h('span', { class:'ol' }, label),
    h('div', { class:'seg' }, opts.map(([v, l, fam]) => h('button', { type:'button', 'aria-pressed': String(v === val), lang:langAttr || null,
      style: fam ? 'font-family:"' + fam + '",inherit' : null, onclick:() => onpick(v) }, l))));
}
function showSettings() {
  const T = t(), sh = $('sheet'); sh.replaceChildren(); sh.className = 'sheet';
  let armed = false;
  const rst = h('button', { class:'danger', type:'button', onclick:() => {
    if (!armed) { armed = true; rst.textContent = T.reset2; return; }
    const l = D.lang || 'ja';
    D.badge[l] = {}; D.know[l] = {}; D.best[l] = {}; save(); closeOv(); if (D.lang) viewLines(T.resetDone);
  } }, T.reset);
  const redraw = () => {
    save(); applyLook(); showSettings();
    if (S.view === 'play' && !S.over) { const v = $('ans') ? $('ans').value : ''; renderPlay(); if ($('ans')) $('ans').value = v; }
    else if (S.view === 'lines') viewLines(); else if (S.view === 'start') viewStart();
  };
  sh.append(
    h('h3', null, T.setTitle, h('button', { class:'tbtn', type:'button', onclick:closeOv }, T.close_)),
    seg(T.themeOpt, D.theme, [['light', T.light], ['dark', T.dark]], v => { D.theme = v; redraw(); }),
    seg(T.ansOpt, D.answer, [['input', T.input], ['choice', T.choice]], v => { D.answer = v; if (S.view === 'play') S.choiceSet = null; redraw(); }),
    seg(T.kanaOpt, D.kana, [['kata', T.kata], ['hira', T.hira]], v => { D.kana = v; redraw(); }),
    seg(T.fjOpt, D.fja, FONTS.ja.map(f => [f[0], f[1], f[2]]), v => { D.fja = v; redraw(); }, 'ja'),
    h('div', { class:'fontprev glyph', lang:'ja' }, 'ギンザ ぎんざ 銀座'),
    seg(T.fkOpt, D.fko, FONTS.ko.map(f => [f[0], f[1], f[2]]), v => { D.fko = v; redraw(); }, 'ko'),
    h('div', { class:'fontprev glyph', lang:'ko' }, '긴자 명동 강남'));
  if (D.lang) sh.append(seg(T.openOpt, D.openAll ? 'all' : 'no', [['no', T.openNo], ['all', T.openAll]], v => { D.openAll = v === 'all'; redraw(); }), rst);
  openOv();
}

/* ---------- collection ---------- */
function availableUnits() {
  const set = new Set();
  for (const id in LINES) for (const s of LINES[id].stations) {
    if (D.lang === 'ja') E.hangulUnits(s.hangul).forEach(u => set.add(u));
    else { const k = s.country === 'jp' ? s.kana : s.kata;
      E.kanaUnits(E.toKata(k)).forEach(u => set.add(u)); E.kanaUnits(E.toHira(k)).forEach(u => set.add(u)); }
  }
  return set;
}
function showColl(tab) {
  const T = t(), sh = $('sheet'); sh.replaceChildren(); sh.className = 'sheet coll';
  const tabs = D.lang === 'ja' ? [['st', T.tStations], ['hg', T.tHangul]] : [['st', T.tStations], ['K', T.tKata], ['H', T.tHira]];
  tab = tab || S.collTab || 'st'; S.collTab = tab;
  sh.append(h('h3', null, T.coll, h('button', { class:'tbtn', type:'button', onclick:closeOv }, T.close_)),
    h('div', { class:'tabs' }, tabs.map(([k, l]) => h('button', { type:'button', 'aria-pressed': String(k === tab), onclick:() => showColl(k) }, l))));
  if (tab === 'st') {
    ORDER[D.lang].forEach(id => {
      const L = LINES[id], got = badges(id);
      sh.append(h('h4', null, lineName(id), h('span', null, badgeCount(id) + '/' + L.stations.length)),
        h('div', { class:'stgrid', style:'--c:' + L.color },
          L.stations.map(s => got[s.idx]
            ? h('span', { class:'badge got glyph', lang: L.country === 'jp' ? 'ja' : 'ko' }, s.name)
            : h('span', { class:'badge no' }, '？'))));
    });
  } else {
    const avail = availableUnits();
    sh.append(h('div', { class:'legend' },
      h('span', null, h('i', { style:'background:var(--sign)' }), T.lv0),
      h('span', null, h('i', { style:'background:color-mix(in srgb,var(--lv1) 50%,var(--sign));border-color:var(--lv1)' }), T.lv1),
      h('span', null, h('i', { style:'background:color-mix(in srgb,var(--lv2) 50%,var(--sign));border-color:var(--lv2)' }), T.lv2),
      h('span', null, h('i', { style:'border-style:dashed' }), T.lvVoid)));
    const grid = (title, items, langAttr, sub) => {
      const cells = items.map(([unit, label, note]) => {
        const lv = level(unit), v = !avail.has(unit);
        return h('div', { class:'cell' + (v ? ' void' : lv === 2 ? ' l2' : lv === 1 ? ' l1' : ''), title: note || '' },
          h('b', { class:'glyph', lang:langAttr }, label), note ? h('span', null, note) : null);
      });
      const done = items.filter(([u]) => level(u) === 2).length;
      return [h('h4', null, title, h('span', null, done + '/' + items.length)), h('div', { class:'cgrid' }, cells)];
    };
    if (tab === 'hg') {
      const snd = { L:i => E.L_SND[E.L_J.indexOf(i)], V:i => E.V_KANA[E.V_J.indexOf(i)], T:i => E.T_KANA[E.T_J.indexOf(i)] || '' };
      const mk = (pre, arr) => arr.map(j => ['' + pre + ':' + j, j, snd[pre](j)]);
      sh.append(...grid(T.gL, mk('L', H_L), 'ko'), ...grid(T.gV, mk('V', H_V), 'ko'), ...grid(T.gT, mk('T', H_T), 'ko'),
        ...grid(T.gRare, mk('L', H_L_RARE).concat(mk('V', H_V_RARE), mk('T', H_T_RARE)), 'ko'));
    } else {
      const conv = tab === 'K' ? E.toKata : E.toHira;
      const mk = arr => arr.map(k => { const s = conv(k); return [tab + ':' + s, s, E.moraHangul(k)]; });
      sh.append(...grid(T.gBase, mk(KANA_BASE), 'ja'), ...grid(T.gDaku, mk(KANA_DAKU), 'ja'),
        ...grid(T.gYoon, mk(KANA_YOON), 'ja'), ...grid(T.gSmall, mk(KANA_SMALL), 'ja'), ...grid(T.gRare, mk(KANA_RARE), 'ja'));
    }
  }
  openOv();
}

$('bSet').addEventListener('click', showSettings);
$('bColl').addEventListener('click', () => showColl());
let taps = [];
$('logo').addEventListener('click', () => {
  const now = Date.now();
  taps = taps.filter(x => now - x < 2000); taps.push(now);
  if (taps.length >= 5) { taps = []; viewDev(); return; }
  if (S.view !== 'start') viewStart();
});

applyLook();
if (D.lang) viewLines(); else viewStart();
})();
</script>
